name: Unzip app
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and remove the zip
        run: |
          for z in *.zip; do
            unzip -o "$z" -x ".github/*"
            rm "$z"
          done
      - name: Commit the files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unzipped app update" || echo "Nothing to commit"
          git push
