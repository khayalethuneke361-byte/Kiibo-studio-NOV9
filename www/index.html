<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiibo Control</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap">
<style>
:root{--bg:#060807;--card:#111613;--line:#222b25;--tx:#eef3ef;--mu:#8d9a92;--ac:#39ff14;--acx:#061200;--bad:#ff5a5f;--warn:#ffb020;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f6f4;--card:#fff;--line:#d9e1dc;--tx:#101512;--mu:#5d6a63;--ac:#1c9a00;--acx:#fff;--bad:#c62828;--warn:#b26a00}}
:root[data-theme="light"]{--bg:#f3f6f4;--card:#fff;--line:#d9e1dc;--tx:#101512;--mu:#5d6a63;--ac:#1c9a00;--acx:#fff;--bad:#c62828;--warn:#b26a00}
:root[data-theme="dark"]{--bg:#060807;--card:#111613;--line:#222b25;--tx:#eef3ef;--mu:#8d9a92;--ac:#39ff14;--acx:#061200;--bad:#ff5a5f;--warn:#ffb020}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
h1,h2{font-family:Oswald,"Arial Narrow",Impact,sans-serif;font-weight:700;margin:0;letter-spacing:.01em}
h1{font-size:28px}h2{font-size:20px;margin:22px 0 10px}
main{max-width:640px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sub{color:var(--mu);font-size:13px;margin:2px 0 0}
.demo{background:var(--card);border:1px dashed var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--mu);margin:14px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.st b{display:block;font:700 30px/1.1 Oswald,sans-serif}
.st span{color:var(--mu);font-size:13px}
.st.flag b{color:var(--warn)}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;cursor:pointer;width:100%;text-align:left;color:inherit;font:inherit}
.row .av{width:38px;height:38px;border-radius:50%;background:var(--line);display:grid;place-items:center;font:700 15px Oswald,sans-serif;flex:none}
.row .m{flex:1;min-width:0}
.row .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m span{color:var(--mu);font-size:13px}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.ok{color:var(--ac);border-color:var(--ac)}.bad{color:var(--bad);border-color:var(--bad)}.warn{color:var(--warn);border-color:var(--warn)}
input[type=search]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;margin:12px 0 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--mu);font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.btn{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.btn.d{color:var(--bad);border-color:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1;min-width:120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card h3{margin:0 0 2px;font:700 18px Oswald,sans-serif}
.dev{border-left:3px solid var(--line)}.dev.f{border-left-color:var(--warn)}
.log{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.log i{font-style:normal;color:var(--mu);font-size:12px;min-width:54px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:12px;padding:6px 0;cursor:pointer;border-radius:10px}
nav button.on{color:var(--ac);font-weight:700}
nav button svg{display:block;margin:0 auto 2px;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:9}
#sh.on{display:flex}
#sh>div{background:var(--bg);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:640px;margin:0 auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span:first-child{color:var(--mu)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ac);color:var(--acx);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:12;max-width:90%}
#toast.on{opacity:1}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

.login{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:10px}
input[type=email],input[type=password]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:0}
.empty{color:var(--mu);padding:18px 4px}

.f label{display:block;font-size:13px;color:var(--mu);margin:8px 0 0}
.f input[type=text],.f input[type=number],.f input[type=date],.f textarea,.sel{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;margin-top:4px}
.f label.ck,label.ck{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px;margin:10px 0}
.f label.ck input,label.ck input{width:auto;margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns .sel{flex:1;min-width:120px;margin-top:0}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="sh"><div id="shc"></div></div>
<div id="toast"></div>
<script src="js/config.js"></script>
<script src="js/version.js"></script>
<script src="js/app.js"></script>
</body>
</html>
